<script>
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const STORAGE_KEY='dupguard_v2';

function loadDB(){
  try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}
  return {emails:new Array(...SEED_EMAILS).map(v=>({value:v,sheet:'Google Sheet (seeded)',addedAt:'Pre-loaded'})),
          domains:new Array(...SEED_DOMAINS).map(v=>({value:v,sheet:'Google Sheet (seeded)',addedAt:'Pre-loaded'})),
          sheets:[{name:'Google Sheet (seeded)',addedAt:'Pre-loaded',emailCount:SEED_EMAILS.length,domainCount:SEED_DOMAINS.length}]};
}
function saveDB(db){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){console.warn('Storage full, not persisting');}
}
function normalizeEmail(e){return(e||'').toLowerCase().trim();}
function normalizeDomain(d){
  if(!d)return'';
  let s=d.toLowerCase().trim().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].split('?')[0];
  return s.trim();
}
function isDomainCol(h){return/domain/i.test(h);}
function isEmailCol(h){return/email/i.test(h)&&!/sent/i.test(h)&&!/status/i.test(h);}
function autoDetectCols(headers){
  const emailCols=[];const domainCols=[];
  headers.forEach(h=>{
    if(isEmailCol(h))emailCols.push(h);
    if(isDomainCol(h))domainCols.push(h);
  });
  return{emailCols,domainCols};
}
function downloadCSV(rows,filename){
  if(!rows.length)return;
  const headers=Object.keys(rows[0]);
  const csv=[headers.join(','),...rows.map(r=>
    headers.map(h=>{const v=(r[h]??'').toString().replace(/"/g,'\"\"');return/[,"\n]/.test(v)?`"${v}"`:v;}).join(',')
  )].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=filename;a.click();
}

// Toast
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);
  return React.createElement('div',{className:'toast'},msg);
}

// ── ADMIN PAGE ───────────────────────────────────────────────────────────────
function AdminPage({db,setDB,showToast}){
  const [drag,setDrag]=useState(false);
  const [parsed,setParsed]=useState(null);
  const [colMap,setColMap]=useState({});// key: colName, value: 'email'|'domain'|'data'
  const [sheetName,setSheetName]=useState('');
  const [loading,setLoading]=useState(false);
  const [tab,setTab]=useState('emails');
  const [search,setSearch]=useState('');
  const fileRef=useRef();

  function handleFile(file){
    if(!file)return;
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:(res)=>{
      const rows=res.data;if(!rows.length)return;
      setParsed(rows);
      const headers=Object.keys(rows[0]);
      const {emailCols,domainCols}=autoDetectCols(headers);
      const map={};
      headers.forEach(h=>{
        if(emailCols.includes(h))map[h]='email';
        else if(domainCols.includes(h))map[h]='domain';
        else map[h]='data';
      });
      setColMap(map);
      setSheetName(file.name.replace(/\.csv$/i,''));
    }});
  }

  function handleImport(){
    if(!parsed)return;
    setLoading(true);
    setTimeout(()=>{
      const emailSet=new Set(db.emails.map(e=>normalizeEmail(e.value)));
      const domainSet=new Set(db.domains.map(d=>normalizeDomain(d.value)));
      let addedE=0,addedD=0;
      const ts=new Date().toLocaleString();
      const emails=[...db.emails];
      const domains=[...db.domains];
      const emailCols=Object.entries(colMap).filter(([,v])=>v==='email').map(([k])=>k);
      const domainCols=Object.entries(colMap).filter(([,v])=>v==='domain').map(([k])=>k);
      parsed.forEach(row=>{
        emailCols.forEach(ec=>{
          const v=normalizeEmail(row[ec]);
          if(v&&v.includes('@')&&!emailSet.has(v)){emails.push({value:v,sheet:sheetName,addedAt:ts});emailSet.add(v);addedE++;}
        });
        domainCols.forEach(dc=>{
          const v=normalizeDomain(row[dc]);
          if(v&&v.includes('.')&&!domainSet.has(v)){domains.push({value:v,sheet:sheetName,addedAt:ts});domainSet.add(v);addedD++;}
        });
      });
      const sheets=[...db.sheets,{name:sheetName,addedAt:ts,emailCount:addedE,domainCount:addedD,rows:parsed.length}];
      const nd={emails,domains,sheets};
      saveDB(nd);setDB(nd);setParsed(null);setLoading(false);
      showToast(`✓ Added ${addedE} emails & ${addedD} domains`);
    },350);
  }

  const headers=parsed?Object.keys(parsed[0]||{}):[]; 
  const filtered=tab==='emails'
    ?db.emails.filter(e=>!search||e.value.includes(search.toLowerCase()))
    :db.domains.filter(d=>!search||d.value.includes(search.toLowerCase()));

  return React.createElement('div',{className:'page'},
    React.createElement('div',{className:'flex items-center justify-between mb-2'},
      React.createElement('div',null,
        React.createElement('div',{className:'page-title'},'🗄 Master Database'),
        React.createElement('div',{className:'page-sub'},`Pre-loaded from your Google Sheet. Add more sheets anytime.`)
      ),
      React.createElement('button',{className:'btn btn-danger btn-sm',onClick:()=>{
        if(!confirm('Reset to original seeded data only?'))return;
        const nd=loadDB();// reloads seed
        localStorage.removeItem(STORAGE_KEY);
        const fresh=loadDB();saveDB(fresh);setDB(fresh);
        showToast('Reset to seed data');
      }},'↺ Reset DB')
    ),

    React.createElement('div',{className:'stats'},
      React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'Emails in DB'),React.createElement('div',{className:'stat-value blue'},db.emails.length.toLocaleString())),
      React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'Domains in DB'),React.createElement('div',{className:'stat-value amber'},db.domains.length.toLocaleString())),
      React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'Sheets Loaded'),React.createElement('div',{className:'stat-value green'},db.sheets.length)),
      React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'Total Records'),React.createElement('div',{className:'stat-value'},(db.emails.length+db.domains.length).toLocaleString()))
    ),

    // Upload card
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'📤 Add More Sheets to Master DB'),
      !parsed
        ?React.createElement('div',{
            className:`upload-zone${drag?' drag':''}`,
            onDragOver:e=>{e.preventDefault();setDrag(true)},
            onDragLeave:()=>setDrag(false),
            onDrop:e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])},
            onClick:()=>fileRef.current.click()
          },
          React.createElement('input',{ref:fileRef,type:'file',accept:'.csv',style:{display:'none'},onChange:e=>handleFile(e.target.files[0])}),
          React.createElement('div',{className:'upload-icon'},'📂'),
          React.createElement('div',{className:'upload-title'},'Drop CSV here or click to browse'),
          React.createElement('div',{className:'upload-sub'},'Columns with "Email" or "Domain" in the header are auto-detected')
        )
        :React.createElement('div',null,
          React.createElement('div',{className:'notice notice-success'},`✅ ${parsed.length} rows loaded — review column assignments below`),
          React.createElement('div',{className:'card-title'},'Assign each column:'),
          React.createElement('div',{className:'table-wrap'},
            React.createElement('table',null,
              React.createElement('thead',null,
                React.createElement('tr',null,
                  React.createElement('th',null,'Column Name'),
                  React.createElement('th',null,'Auto-detected as'),
                  React.createElement('th',null,'Override')
                )
              ),
              React.createElement('tbody',null,
                headers.map(h=>React.createElement('tr',{key:h},
                  React.createElement('td',null,React.createElement('span',{className:'tag'},h)),
                  React.createElement('td',null,
                    colMap[h]==='email'?React.createElement('span',{className:'badge badge-email'},'📧 Email'):
                    colMap[h]==='domain'?React.createElement('span',{className:'badge badge-domain'},'🌐 Domain'):
                    React.createElement('span',{className:'badge badge-info'},'Other data')
                  ),
                  React.createElement('td',null,
                    React.createElement('select',{value:colMap[h]||'data',onChange:e=>setColMap({...colMap,[h]:e.target.value}),style:{fontSize:12}},
                      React.createElement('option',{value:'email'},'📧 Email column'),
                      React.createElement('option',{value:'domain'},'🌐 Domain column'),
                      React.createElement('option',{value:'data'},'Other data (skip)')
                    )
                  )
                ))
              )
            )
          ),
          React.createElement('div',{style:{marginTop:12}},
            React.createElement('label',{style:{fontSize:12,fontWeight:600,color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.4px'}},
              'Sheet Label'),
            React.createElement('div',{style:{marginTop:5}},
              React.createElement('input',{type:'text',value:sheetName,onChange:e=>setSheetName(e.target.value),placeholder:'e.g. June Batch 2',style:{width:260}})
            )
          ),
          React.createElement('div',{className:'flex gap-2 mt-3'},
            React.createElement('button',{className:'btn btn-primary',onClick:handleImport,disabled:loading||!Object.values(colMap).some(v=>v!=='data')},
              loading?'⏳ Importing…':'🚀 Import to Master DB'),
            React.createElement('button',{className:'btn',onClick:()=>setParsed(null)},'✕ Cancel')
          )
        )
    ),

    // Sheet log
    db.sheets.length>0&&React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'📚 Loaded Sheets'),
      React.createElement('div',{className:'table-wrap'},
        React.createElement('table',null,
          React.createElement('thead',null,
            React.createElement('tr',null,
              React.createElement('th',null,'Sheet'),
              React.createElement('th',null,'Emails'),
              React.createElement('th',null,'Domains'),
              React.createElement('th',null,'Loaded At')
            )
          ),
          React.createElement('tbody',null,
            db.sheets.map((s,i)=>React.createElement('tr',{key:i},
              React.createElement('td',null,s.name),
              React.createElement('td',null,React.createElement('span',{className:'badge badge-email'},s.emailCount??'—')),
              React.createElement('td',null,React.createElement('span',{className:'badge badge-domain'},s.domainCount??'—')),
              React.createElement('td',null,React.createElement('span',{className:'text-sm'},s.addedAt))
            ))
          )
        )
      )
    ),

    // Browse
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'section-header'},
        React.createElement('div',{className:'flex gap-2 items-center'},
          React.createElement('button',{className:`btn btn-sm${tab==='emails'?' btn-primary':''}`,onClick:()=>setTab('emails')},`📧 Emails (${db.emails.length.toLocaleString()})`),
          React.createElement('button',{className:`btn btn-sm${tab==='domains'?' btn-primary':''}`,onClick:()=>setTab('domains')},`🌐 Domains (${db.domains.length.toLocaleString()})`)
        ),
        React.createElement('input',{className:'search-input',placeholder:'🔍 Search…',value:search,onChange:e=>setSearch(e.target.value)})
      ),
      filtered.length===0
        ?React.createElement('div',{className:'empty-state'},'No records found.')
        :React.createElement('div',null,
          React.createElement('div',{className:'table-wrap'},
            React.createElement('table',null,
              React.createElement('thead',null,
                React.createElement('tr',null,
                  React.createElement('th',null,tab==='emails'?'Email':'Domain'),
                  React.createElement('th',null,'Source'),
                  React.createElement('th',null,'Added')
                )
              ),
              React.createElement('tbody',null,
                filtered.slice(0,200).map((item,i)=>React.createElement('tr',{key:i},
                  React.createElement('td',null,item.value),
                  React.createElement('td',null,React.createElement('span',{className:'tag'},item.sheet||'—')),
                  React.createElement('td',null,React.createElement('span',{className:'text-sm'},item.addedAt))
                ))
              )
            )
          ),
          filtered.length>200&&React.createElement('div',{className:'text-sm mt-2'},`Showing 200 of ${filtered.length.toLocaleString()}. Use search to narrow.`)
        )
    )
  );
}

// ── CHECKER PAGE ─────────────────────────────────────────────────────────────
function CheckerPage({db,showToast}){
  const [drag,setDrag]=useState(false);
  const [parsed,setParsed]=useState(null);
  const [colMap,setColMap]=useState({});
  const [results,setResults]=useState(null);
  const [checking,setChecking]=useState(false);
  const [viewTab,setViewTab]=useState('all');
  const [search,setSearch]=useState('');
  const fileRef=useRef();

  // Single entry
  const [singleEmail,setSingleEmail]=useState('');
  const [singleDomain,setSingleDomain]=useState('');
  const [singleResult,setSingleResult]=useState(null);
  const [mode,setMode]=useState('bulk');

  function handleFile(file){
    if(!file)return;
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:(res)=>{
      const rows=res.data;if(!rows.length)return;
      setParsed(rows);setResults(null);
      const headers=Object.keys(rows[0]);
      const {emailCols,domainCols}=autoDetectCols(headers);
      const map={};
      headers.forEach(h=>{
        if(emailCols.includes(h))map[h]='email';
        else if(domainCols.includes(h))map[h]='domain';
        else map[h]='data';
      });
      setColMap(map);
    }});
  }

  function runCheck(){
    if(!parsed)return;
    setChecking(true);
    setTimeout(()=>{
      const emailSet=new Set(db.emails.map(e=>normalizeEmail(e.value)));
      const domainSet=new Set(db.domains.map(d=>normalizeDomain(d.value)));
      const emailCols=Object.entries(colMap).filter(([,v])=>v==='email').map(([k])=>k);
      const domainCols=Object.entries(colMap).filter(([,v])=>v==='domain').map(([k])=>k);

      const out=parsed.map(row=>{
        let overallStatus='NEW';
        const emailStatuses={};
        const domainStatuses={};

        emailCols.forEach(ec=>{
          const v=normalizeEmail(row[ec]);
          emailStatuses[ec]=v&&v.includes('@')?(emailSet.has(v)?'DUPLICATE':'NEW'):'';
        });
        domainCols.forEach(dc=>{
          const v=normalizeDomain(row[dc]);
          domainStatuses[dc]=v&&v.includes('.')?(domainSet.has(v)?'DUPLICATE':'NEW'):'';
        });

        const allStatuses=[...Object.values(emailStatuses),...Object.values(domainStatuses)].filter(Boolean);
        if(allStatuses.length===0)overallStatus='UNCHECKED';
        else if(allStatuses.some(s=>s==='DUPLICATE'))overallStatus='DUPLICATE';
        else overallStatus='NEW';

        // Build detail strings for email/domain check columns
        const emailDetail=emailCols.map(ec=>`${ec}: ${emailStatuses[ec]||'—'}`).join(' | ');
        const domainDetail=domainCols.map(dc=>`${dc}: ${domainStatuses[dc]||'—'}`).join(' | ');

        return{...row,__status:overallStatus,__emailDetail:emailDetail,__domainDetail:domainDetail};
      });

      setResults(out);setChecking(false);setViewTab('all');
      const dups=out.filter(r=>r.__status==='DUPLICATE').length;
      const news=out.filter(r=>r.__status==='NEW').length;
      showToast(`✓ ${news} new · ${dups} duplicates`);
    },500);
  }

  function checkSingle(){
    const emailSet=new Set(db.emails.map(e=>normalizeEmail(e.value)));
    const domainSet=new Set(db.domains.map(d=>normalizeDomain(d.value)));
    const email=normalizeEmail(singleEmail);
    const domain=normalizeDomain(singleDomain);
    setSingleResult({
      email,domain,
      emailStatus:email?(emailSet.has(email)?'DUPLICATE':'NEW'):'',
      domainStatus:domain?(domainSet.has(domain)?'DUPLICATE':'NEW'):''
    });
  }

  function doDownload(filter){
    if(!results)return;
    let rows=results;
    if(filter==='new')rows=rows.filter(r=>r.__status==='NEW');
    if(filter==='dup')rows=rows.filter(r=>r.__status==='DUPLICATE');
    // Remove internal keys, add STATUS column at front
    const clean=rows.map(row=>{
      const {__status,__emailDetail,__domainDetail,...rest}=row;
      return{STATUS:__status,...rest};
    });
    downloadCSV(clean,`dupguard_${filter}_${Date.now()}.csv`);
    showToast(`Downloaded ${rows.length} rows`);
  }

  const headers=parsed?Object.keys(parsed[0]||{}).filter(h=>!h.startsWith('__')):[];
  const emailCols=Object.entries(colMap).filter(([,v])=>v==='email').map(([k])=>k);
  const domainCols=Object.entries(colMap).filter(([,v])=>v==='domain').map(([k])=>k);
  const otherCols=Object.entries(colMap).filter(([,v])=>v==='data').map(([k])=>k);

  const newCount=results?results.filter(r=>r.__status==='NEW').length:0;
  const dupCount=results?results.filter(r=>r.__status==='DUPLICATE').length:0;
  const unCount=results?results.filter(r=>r.__status==='UNCHECKED').length:0;

  const displayRows=useMemo(()=>{
    if(!results)return[];
    let r=results;
    if(viewTab==='new')r=r.filter(x=>x.__status==='NEW');
    if(viewTab==='dup')r=r.filter(x=>x.__status==='DUPLICATE');
    if(search)r=r.filter(x=>Object.values(x).join(' ').toLowerCase().includes(search.toLowerCase()));
    return r;
  },[results,viewTab,search]);

  // Show cols in table: status first, then email cols, then domain cols, then first 4 other cols
  const tableCols=useMemo(()=>[...emailCols,...domainCols,...otherCols.slice(0,4)],[colMap]);

  return React.createElement('div',{className:'page'},
    React.createElement('div',null,
      React.createElement('div',{className:'page-title'},'🔍 Duplicate Checker'),
      React.createElement('div',{className:'page-sub'},`Checking against ${db.emails.length.toLocaleString()} emails & ${db.domains.length.toLocaleString()} domains`)
    ),

    React.createElement('div',{className:'flex gap-2 mb-3'},
      React.createElement('button',{className:`btn${mode==='bulk'?' btn-primary':''}`,onClick:()=>setMode('bulk')},'📁 Bulk CSV Check'),
      React.createElement('button',{className:`btn${mode==='single'?' btn-primary':''}`,onClick:()=>setMode('single')},'✏️ Single Entry')
    ),

    // Single mode
    mode==='single'&&React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'✏️ Quick Check — Single Entry'),
      React.createElement('div',{style:{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}},
        React.createElement('div',{style:{flex:1,minWidth:200}},
          React.createElement('label',{style:{display:'block',fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.4px'}},'Email'),
          React.createElement('input',{type:'text',placeholder:'john@example.com',value:singleEmail,onChange:e=>setSingleEmail(e.target.value),style:{width:'100%'}})
        ),
        React.createElement('div',{style:{flex:1,minWidth:200}},
          React.createElement('label',{style:{display:'block',fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.4px'}},'Domain'),
          React.createElement('input',{type:'text',placeholder:'example.com',value:singleDomain,onChange:e=>setSingleDomain(e.target.value),style:{width:'100%'}})
        ),
        React.createElement('button',{className:'btn btn-primary',onClick:checkSingle,disabled:!singleEmail&&!singleDomain},'🔍 Check')
      ),
      singleResult&&React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:14}},
        singleResult.email&&React.createElement('div',{className:'stat'},
          React.createElement('div',{className:'stat-label'},'Email'),
          React.createElement('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:12,marginBottom:7,overflow:'hidden',textOverflow:'ellipsis'}},singleResult.email),
          singleResult.emailStatus==='DUPLICATE'
            ?React.createElement('span',{className:'badge badge-dup'},'⚠ DUPLICATE in master DB')
            :React.createElement('span',{className:'badge badge-new'},'✓ NEW — not in master DB')
        ),
        singleResult.domain&&React.createElement('div',{className:'stat'},
          React.createElement('div',{className:'stat-label'},'Domain'),
          React.createElement('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:12,marginBottom:7,overflow:'hidden',textOverflow:'ellipsis'}},singleResult.domain),
          singleResult.domainStatus==='DUPLICATE'
            ?React.createElement('span',{className:'badge badge-dup'},'⚠ DUPLICATE in master DB')
            :React.createElement('span',{className:'badge badge-new'},'✓ NEW — not in master DB')
        )
      )
    ),

    // Bulk mode
    mode==='bulk'&&React.createElement('div',null,
      // Step 1 — Upload
      !parsed&&React.createElement('div',null,
        React.createElement('div',{className:'notice notice-info'},
          '💡 Upload your team's CSV. Columns with "email" or "domain" in the header are auto-detected. All other columns (Name, Status, etc.) are preserved in the output.'
        ),
        React.createElement('div',{
          className:`upload-zone${drag?' drag':''}`,
          onDragOver:e=>{e.preventDefault();setDrag(true)},
          onDragLeave:()=>setDrag(false),
          onDrop:e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])},
          onClick:()=>fileRef.current.click()
        },
          React.createElement('input',{ref:fileRef,type:'file',accept:'.csv',style:{display:'none'},onChange:e=>handleFile(e.target.files[0])}),
          React.createElement('div',{className:'upload-icon'},'📤'),
          React.createElement('div',{className:'upload-title'},'Upload team CSV to check'),
          React.createElement('div',{className:'upload-sub'},'All your columns come back in the output — sorted into New / Duplicate')
        )
      ),

      // Step 2 — Column review
      parsed&&!results&&React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title'},`📂 ${parsed.length} rows — Review column assignments`),
        React.createElement('div',{className:'notice notice-info'},
          `Auto-detected: ${emailCols.length} email column${emailCols.length!==1?'s':''} (${emailCols.join(', ')||'none'}), ${domainCols.length} domain column${domainCols.length!==1?'s':''} (${domainCols.join(', ')||'none'}). ${otherCols.length} other columns will be passed through unchanged.`
        ),
        React.createElement('div',{className:'table-wrap'},
          React.createElement('table',null,
            React.createElement('thead',null,
              React.createElement('tr',null,
                React.createElement('th',null,'Column'),
                React.createElement('th',null,'Sample Data'),
                React.createElement('th',null,'Type'),
                React.createElement('th',null,'Change')
              )
            ),
            React.createElement('tbody',null,
              headers.map(h=>{
                const sample=(parsed.slice(0,3).map(r=>r[h]).filter(Boolean).join(', ')||'—').substring(0,50);
                return React.createElement('tr',{key:h},
                  React.createElement('td',null,React.createElement('span',{className:'tag'},h)),
                  React.createElement('td',null,React.createElement('span',{style:{fontSize:11,color:'var(--text2)',fontFamily:"'DM Mono',monospace"}},sample)),
                  React.createElement('td',null,
                    colMap[h]==='email'?React.createElement('span',{className:'badge badge-email'},'📧 Email — will check'):
                    colMap[h]==='domain'?React.createElement('span',{className:'badge badge-domain'},'🌐 Domain — will check'):
                    React.createElement('span',{className:'badge badge-info'},'Passthrough — not checked')
                  ),
                  React.createElement('td',null,
                    React.createElement('select',{value:colMap[h]||'data',onChange:e=>setColMap({...colMap,[h]:e.target.value}),style:{fontSize:12}},
                      React.createElement('option',{value:'email'},'📧 Email — check'),
                      React.createElement('option',{value:'domain'},'🌐 Domain — check'),
                      React.createElement('option',{value:'data'},'Passthrough — skip')
                    )
                  )
                );
              })
            )
          )
        ),
        React.createElement('div',{className:'flex gap-2 mt-3'},
          React.createElement('button',{className:'btn btn-primary',onClick:runCheck,disabled:checking||(!emailCols.length&&!domainCols.length)},
            checking?'⏳ Checking…':'🔍 Run Duplicate Check'
          ),
          React.createElement('button',{className:'btn',onClick:()=>{setParsed(null);setResults(null)}},'✕ Reset')
        )
      ),

      // Results
      results&&React.createElement('div',null,
        React.createElement('div',{className:'stats'},
          React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'Total Rows'),React.createElement('div',{className:'stat-value blue'},results.length)),
          React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'✓ New'),React.createElement('div',{className:'stat-value green'},newCount)),
          React.createElement('div',{className:'stat'},React.createElement('div',{className:'stat-label'},'⚠ Duplicates'),React.createElement('div',{className:'stat-value red'},dupCount)),
          React.createElement('div',{className:'stat'},
            React.createElement('div',{className:'stat-label'},'Duplicate Rate'),
            React.createElement('div',{className:'stat-value amber'},`${results.length?Math.round(dupCount/results.length*100):0}%`)
          )
        ),

        React.createElement('div',{className:'card'},
          // Downloads
          React.createElement('div',{className:'flex gap-2 mb-3 items-center justify-between',style:{flexWrap:'wrap'}},
            React.createElement('div',{className:'flex gap-2',style:{flexWrap:'wrap'}},
              React.createElement('button',{className:'btn btn-success',onClick:()=>doDownload('all')},`⬇ All Rows (${results.length})`),
              React.createElement('button',{className:'btn btn-success',onClick:()=>doDownload('new')},`⬇ New Only (${newCount})`),
              React.createElement('button',{className:'btn btn-danger',onClick:()=>doDownload('dup')},`⬇ Duplicates (${dupCount})`)
            ),
            React.createElement('button',{className:'btn btn-sm',onClick:()=>{setParsed(null);setResults(null);setSearch('')}},'🔄 New Check')
          ),

          React.createElement('div',{className:'notice notice-success'},
            `✓ Downloaded files include ALL original columns (${headers.join(', ')}) plus a STATUS column added at the front.`
          ),

          // Tabs + search
          React.createElement('div',{className:'flex items-center justify-between',style:{flexWrap:'wrap',gap:8,marginBottom:12}},
            React.createElement('div',{className:'result-tabs',style:{margin:0}},
              React.createElement('button',{className:`result-tab${viewTab==='all'?' active-all':''}`,onClick:()=>setViewTab('all')},`All (${results.length})`),
              React.createElement('button',{className:`result-tab${viewTab==='new'?' active-new':''}`,onClick:()=>setViewTab('new')},`✓ New (${newCount})`),
              React.createElement('button',{className:`result-tab${viewTab==='dup'?' active-dup':''}`,onClick:()=>setViewTab('dup')},`⚠ Dup (${dupCount})`)
            ),
            React.createElement('input',{className:'search-input',placeholder:'🔍 Filter rows…',value:search,onChange:e=>setSearch(e.target.value)})
          ),

          // Table
          React.createElement('div',{className:'table-wrap'},
            React.createElement('table',null,
              React.createElement('thead',null,
                React.createElement('tr',null,
                  React.createElement('th',null,'Status'),
                  ...tableCols.map(c=>{
                    const type=colMap[c]||'data';
                    const label=type==='email'?`📧 ${c}`:type==='domain'?`🌐 ${c}`:c;
                    return React.createElement('th',{key:c},label);
                  })
                )
              ),
              React.createElement('tbody',null,
                displayRows.slice(0,150).map((row,i)=>
                  React.createElement('tr',{key:i},
                    React.createElement('td',null,
                      row.__status==='DUPLICATE'?React.createElement('span',{className:'badge badge-dup'},'⚠ DUP'):
                      row.__status==='NEW'?React.createElement('span',{className:'badge badge-new'},'✓ NEW'):
                      React.createElement('span',{className:'badge badge-info'},'—')
                    ),
                    ...tableCols.map(c=>{
                      const type=colMap[c]||'data';
                      const val=row[c]||'';
                      let badge=null;
                      if(type==='email'&&val){
                        const v=normalizeEmail(val);
                        const isDup=new Set(db.emails.map(e=>normalizeEmail(e.value))).has(v);
                        badge=isDup?React.createElement('span',{className:'badge badge-dup',style:{fontSize:10,marginLeft:4}},'dup'):React.createElement('span',{className:'badge badge-new',style:{fontSize:10,marginLeft:4}},'new');
                      }
                      if(type==='domain'&&val){
                        const v=normalizeDomain(val);
                        const isDup=new Set(db.domains.map(d=>normalizeDomain(d.value))).has(v);
                        badge=isDup?React.createElement('span',{className:'badge badge-dup',style:{fontSize:10,marginLeft:4}},'dup'):React.createElement('span',{className:'badge badge-new',style:{fontSize:10,marginLeft:4}},'new');
                      }
                      return React.createElement('td',{key:c,style:{fontFamily:type==='data'?'inherit':"'DM Mono',monospace"}},
                        val, badge
                      );
                    })
                  )
                )
              )
            )
          ),
          displayRows.length>150&&React.createElement('div',{className:'text-sm mt-2'},`Showing 150 of ${displayRows.length}. Download for full data.`)
        )
      )
    )
  );
}

// ── DEPLOY PAGE ──────────────────────────────────────────────────────────────
function DeployPage(){
  return React.createElement('div',{className:'page'},
    React.createElement('div',null,
      React.createElement('div',{className:'page-title'},'🚀 Deploy for Your Team'),
      React.createElement('div',{className:'page-sub'},'Host this as a shared URL so all 6-7 team members can access the same tool — free, forever.')
    ),
    React.createElement('div',{className:'notice notice-warn'},
      '⚠️ Right now data is in your browser only (localStorage). After deploying to GitHub Pages, each team member's checker tab reads from the master DB that's embedded in this file. To share live DB updates, use the Google Sheets sync method below.'
    ),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'⭐ Option 1 — GitHub Pages (Free, Recommended)'),
      [
        ['1','Download this file','Save this page as index.html (File → Save As in your browser)'],
        ['2','Create GitHub account','Go to github.com → Free plan is enough'],
        ['3','Create a new repo','Click + → New repository → Name: dupguard → Public → Create'],
        ['4','Upload index.html','Click "Add file" → "Upload files" → drag index.html → Commit changes'],
        ['5','Enable Pages','Settings → Pages → Source: Deploy from branch → Branch: main → Save'],
        ['6','Share with team','Your URL: https://YOURUSERNAME.github.io/dupguard — share this link!'],
      ].map(([n,t,d])=>React.createElement('div',{key:n,className:'step'},
        React.createElement('div',{className:'step-num'},n),
        React.createElement('div',null,
          React.createElement('div',{className:'step-title'},t),
          React.createElement('div',{className:'step-desc'},d)
        )
      ))
    ),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'☁️ Option 2 — Live DB Sync via Google Sheets API'),
      React.createElement('div',{className:'notice notice-info'},'Use this so when you add new sheets in Admin, all team members see the updated master DB instantly without re-deploying.'),
      [
        ['1','Open your Google Sheet','The one you shared — already has your data'],
        ['2','Open Apps Script','Extensions → Apps Script → paste the provided Web App code'],
        ['3','Deploy as Web App','Deploy → New → Web App → Execute as: Me → Anyone can access → Copy URL'],
        ['4','Add URL to the code','In index.html, set APPS_SCRIPT_URL to your deployment URL'],
        ['5','All team members sync','Admin uploads → Google Sheet updates → Team checker pulls live data'],
      ].map(([n,t,d])=>React.createElement('div',{key:n,className:'step'},
        React.createElement('div',{className:'step-num'},n),
        React.createElement('div',null,
          React.createElement('div',{className:'step-title'},t),
          React.createElement('div',{className:'step-desc'},d)
        )
      ))
    ),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'card-title'},'📋 Apps Script Code to Paste'),
      React.createElement('pre',{style:{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:14,fontSize:11,fontFamily:"'DM Mono',monospace",overflowX:'auto',lineHeight:1.6,color:'var(--text)'}},
`function doGet(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet();
  const emails = [], domains = [];
  sheet.getSheets().forEach(tab => {
    const data = tab.getDataRange().getValues();
    if (data.length < 2) return;
    const headers = data[0].map(h => h.toString().toLowerCase());
    const emailIdxs = headers.map((h,i)=>/email/.test(h)&&!/sent|status/.test(h)?i:-1).filter(i=>i>=0);
    const domainIdxs = headers.map((h,i)=>/domain/.test(h)?i:-1).filter(i=>i>=0);
    for (let r = 1; r < data.length; r++) {
      emailIdxs.forEach(i=>{ const v=(data[r][i]||'').toString().trim().toLowerCase(); if(v.includes('@'))emails.push(v); });
      domainIdxs.forEach(i=>{ let v=(data[r][i]||'').toString().trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]; if(v.includes('.'))domains.push(v); });
    }
  });
  const unique = arr => [...new Set(arr)];
  return ContentService.createTextOutput(JSON.stringify({emails:unique(emails),domains:unique(domains)})).setMimeType(ContentService.MimeType.JSON);
}`
      )
    )
  );
}

  const [db,setDB]=useState(()=>loadDB());

  const [toast,setToast]=useState(null);
  const toastKey=useRef(0);

  function showToast(msg){toastKey.current++;setToast({msg,key:toastKey.current});}

  return React.createElement('div',null,
    React.createElement('nav',{className:'nav'},
      React.createElement('div',{className:'nav-brand'},
        React.createElement('div',{className:'brand-dot'}),
        'DupGuard'
      ),
      React.createElement('div',{className:'nav-tabs'},
        React.createElement('button',{className:`nav-tab${tab==='checker'?' active':''}`,onClick:()=>setTab('checker')},'🔍 Checker'),
        React.createElement('button',{className:`nav-tab${tab==='admin'?' active':''}`,onClick:()=>setTab('admin')},'🗄 Admin DB'),
        React.createElement('button',{className:`nav-tab${tab==='deploy'?' active':''}`,onClick:()=>setTab('deploy')},'🚀 Deploy')
      ),
      React.createElement('div',{className:'nav-badge'},
        React.createElement('div',{className:'pulse'}),
        `${(db.emails.length+db.domains.length).toLocaleString()} records live`
      )
    ),
    tab==='checker'&&React.createElement(CheckerPage,{db,showToast}),
    tab==='admin'&&React.createElement(AdminPage,{db,setDB,showToast}),
    tab==='deploy'&&React.createElement(DeployPage),
    toast&&React.createElement(Toast,{key:toast.key,msg:toast.msg,onDone:()=>setToast(null)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
